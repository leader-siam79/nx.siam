*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 14px;background:radial-gradient(circle at 50% 0%,#24304d 0%,#101522 38%,#070a10 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}
.card{width:min(430px,100%);padding:30px 18px 24px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(14,18,29,.72);backdrop-filter:blur(18px);box-shadow:0 25px 70px rgba(0,0,0,.5)}

.links{display:flex;flex-direction:column;gap:11px}.link{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;border-radius:16px;text-decoration:none;color:#fff;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.1);transition:.2s ease;box-shadow:0 8px 25px rgba(0,0,0,.16)}.link:hover{transform:translateY(-2px);background:rgba(255,255,255,.11)}
.icon{width:25px;height:25px;display:grid;place-items:center;flex:none;font-size:19px;font-weight:800}.label{flex:1;text-align:left;font-size:15px;font-weight:600}.arrow{color:#8893a9;font-size:18px}
